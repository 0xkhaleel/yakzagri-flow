name: CI

# Frontend-only CI: lint, build, unit tests, a11y, and visual regression
# for the Next.js application. The backend/contracts/mobile gates live in
# the yakzagri-flow backend repository.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/ci.yml"
      - "frontend/**"
      - "pnpm-lock.yaml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/ci.yml"
      - "frontend/**"
      - "pnpm-lock.yaml"

jobs:
  changes:
    name: Detect Frontend Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'frontend/package-lock.json'

  frontend:
    name: Frontend Required Gate
    runs-on: ubuntu-latest
    needs: changes
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: needs.changes.outputs.frontend == 'true'
        run: pnpm lint

      - name: Type check
        if: needs.changes.outputs.frontend == 'true'
        run: npx tsc --noEmit

      - name: Build
        if: needs.changes.outputs.frontend == 'true'
        run: pnpm build

      - name: Test
        if: needs.changes.outputs.frontend == 'true'
        run: pnpm test -- --json --outputFile=jest-results.json || true

      - name: Fail if tests failed (deferred from --json run)
        if: needs.changes.outputs.frontend == 'true'
        run: |
          node -e "
            const r = require('./jest-results.json');
            if (r.success === false || r.numFailedTests > 0) {
              console.error('Tests failed: ' + r.numFailedTests + ' failure(s)');
              process.exit(1);
            }
          "

      - name: A11y axe audit (blocking)
        if: needs.changes.outputs.frontend == 'true'
        run: pnpm test -- src/__tests__/accessibility --verbose

      - name: Upload coverage report
        if: needs.changes.outputs.frontend == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

      - name: Skip note (no frontend changes)
        if: needs.changes.outputs.frontend != 'true'
        run: echo "No frontend file changes detected, required gate passed."

  visual-regression:
    name: Visual Regression (Playwright)
    runs-on: ubuntu-latest
    needs: [changes, frontend]
    if: needs.changes.outputs.frontend == 'true'
    timeout-minutes: 8
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (Chromium only)
        run: pnpm exec playwright install chromium --with-deps

      - name: Build Next.js app
        run: pnpm build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:4000

      - name: Run visual regression suite
        run: pnpm exec playwright test --project=chromium-desktop --project=chromium-mobile tests/visual
        env:
          CI: true
          NEXT_PUBLIC_API_BASE_URL: http://localhost:4000

      - name: Upload visual regression report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14