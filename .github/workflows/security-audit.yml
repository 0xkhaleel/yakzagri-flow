name: Security Audit

# Blocking dependency vulnerability gate for the frontend + weekly full scan
# (issue #204). High/critical advisories fail the build unless covered by an
# unexpired waiver in .github/audit-waivers.json. Expired waivers also fail.

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - ".github/workflows/security-audit.yml"
      - ".github/audit-waivers.json"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
  pull_request:
    branches: [main, develop]
    paths:
      - ".github/workflows/security-audit.yml"
      - ".github/audit-waivers.json"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
  schedule:
    # Weekly full scan — Monday 06:00 UTC.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install deps (frontend)
        working-directory: frontend
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit gate (frontend)
        run: node scripts/check-audit-waivers.mjs npm frontend frontend

  weekly-report:
    name: Weekly full scan report
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate report
        run: |
          mkdir -p security-reports
          {
            echo "# Weekly dependency audit — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            for ws in frontend; do
              echo "## $ws (pnpm audit)"
              echo '```'
              (cd "$ws" && pnpm install --frozen-lockfile --ignore-scripts >/dev/null 2>&1 && pnpm audit --audit-level low) || true
              echo '```'
              echo
            done
          } | tee security-reports/audit-report.md

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-report
          path: security-reports/audit-report.md
          retention-days: 30